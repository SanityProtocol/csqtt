# Build the csqtt server cores and the APKs from source (CSQTT-APP-PLAN §3, M-158, M-161, M-162), and run every test suite
# (job `test`, M-159: ci/test.sh server | client | app | deploy | bundle) and, in `build`, the client's end-to-end cases
# against the core it built (ci/e2e-server.sh + ci/test.sh e2e).
# - Toolchains are pinned in ci/Dockerfile.server and ci/Dockerfile.android; actions are pinned by commit.
# - The cores' manifest (csqtt.server-provenance.json) is generated here from the cores this run built, and the APK carries
#   exactly those cores.
# - The APKs are UNSIGNED: the signing key never leaves the laptop. This workflow publishes nothing to Releases; release
#   assets are uploaded once, by hand, and never replaced.
# - `ref` (manual runs) builds another source commit with this commit's recipe, e.g. 2.5.3's
#   0188606a243c92a54440be09dc59a93848c463aa to compare with what was shipped. A commit is given as its FULL sha: checkout
#   reads anything shorter as a branch or tag name.
name: build

on:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Source to build: a FULL commit sha, a branch or a tag (empty = this commit); the recipe in ci/ is always this commit's"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  # Every crate and the app's unit tests on every push (M-159). A failing or non-compiling test fails the run; tests marked
  # #[ignore] (a TUN device, a separately started server) are left out here. It runs beside `build`, in the same pinned images.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /

      - name: Checkout the recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: recipe
          persist-credentials: false

      - name: Checkout the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Server build image
        run: docker build -t csqtt-ci-server -f recipe/ci/Dockerfile.server recipe/ci

      - name: Server tests
        run: recipe/ci/test.sh src server

      - name: Client tests
        if: ${{ !cancelled() }}  # a red suite above still lets this one report
        run: recipe/ci/test.sh src client

      - name: Android build image
        if: ${{ !cancelled() }}  # a red suite above still lets this one report
        run: docker build -t csqtt-ci-android -f recipe/ci/Dockerfile.android recipe/ci

      - name: App unit tests
        if: ${{ !cancelled() }}  # a red suite above still lets this one report
        run: recipe/ci/test.sh src app

      # deploy v3 (P2): a `ref` run of a tree from before it (2.5.3's, say) has neither, so these two skip there
      - name: Deploy engine tests
        if: ${{ !cancelled() && hashFiles('src/deploy/build.gradle.kts') != '' }}
        run: recipe/ci/test.sh src deploy

      - name: Deploy bundle checks
        if: ${{ !cancelled() && hashFiles('src/deploy-bundle/**') != '' }}
        run: recipe/ci/test.sh src bundle

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Free disk space
        # the Android image (SDK + NDK) and three Rust target dirs need more than a hosted runner has free; these
        # preinstalled toolchains are never used here (every build runs in our own pinned images)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /

      - name: Checkout the recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: recipe
          persist-credentials: false

      - name: Checkout the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Source commit
        id: src
        run: |
          echo "sha=$(git -C src rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git -C src rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Server build image
        run: docker build -t csqtt-ci-server -f recipe/ci/Dockerfile.server recipe/ci

      - name: Server cores (amd64, arm64, armv7)
        run: for a in amd64 arm64 armv7; do recipe/ci/build-server.sh src "$a" out/cores; done

      - name: Cores manifest
        run: python3 recipe/ci/provenance.py src out/cores "${{ steps.src.outputs.sha }}"

      - name: Android build image
        run: docker build -t csqtt-ci-android -f recipe/ci/Dockerfile.android recipe/ci

      - name: APKs (unsigned)
        run: recipe/ci/build-apk.sh src out/cores out/apk

      - name: Upload the server cores
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: csqtt-server-cores-${{ steps.src.outputs.short }}
          path: |
            out/cores/csqtt-linux-amd64
            out/cores/csqtt-linux-arm64
            out/cores/csqtt-linux-armv7
            out/cores/csqtt.server-provenance.json
            out/cores/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Upload the APKs (unsigned)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: csqtt-apk-unsigned-${{ steps.src.outputs.short }}
          path: |
            out/apk/*.apk
            out/apk/SHA256SUMS.apk
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "### csqtt from ${{ steps.src.outputs.sha }}"
            echo
            echo "| file | bytes | sha256 |"
            echo "|---|---|---|"
            for f in out/cores/csqtt-linux-* out/apk/*.apk; do
              echo "| $(basename "$f") | $(stat -c%s "$f") | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"
            done
            echo
            echo '```json'
            cat out/cores/csqtt.server-provenance.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Server end-to-end tests
        # The client's #[ignore] end-to-end cases against the amd64 core this run built, started in its own network
        # namespace (ci/e2e-server.sh). The throughput case runs at its fixed 128 Mbit/s target with its floors halved: a
        # hosted runner carries the client, the relay and the server at once. Skipped on manual `ref` runs: an older tree
        # (2.5.3) carries the cases before their 2.6.0 fixes. The silent-device case alone waits 610 s (a device's slot
        # is kept for 600 s, P3 §1.9): the step takes about 17 minutes.
        if: ${{ !inputs.ref }}
        timeout-minutes: 30
        run: |
          sudo recipe/ci/e2e-server.sh up out/cores/csqtt-linux-amd64 "$RUNNER_TEMP/e2e"
          set -a; . "$RUNNER_TEMP/e2e/env"; set +a
          rc=0
          CSQTT_E2E_PEER=$PEER CSQTT_E2E_WEB=$WEB CSQTT_E2E_SERVER_LOG=$LOG CSQTT_E2E_MIN_MBIT=64 CSQTT_E2E_MIN_STREAM_KBIT=800 \
            CSQTT_E2E_DEV_PEER=$DEV_PEER CSQTT_E2E_DEV_WEB=$DEV_WEB recipe/ci/test.sh src e2e || rc=$?
          # the wrong-password case ends in a timeout either way; both servers must still be running after every case
          sudo kill -0 "$PID" || { echo "the server process $PID is gone"; rc=1; }
          sudo kill -0 "$DEV_PID" || { echo "the standalone server process $DEV_PID is gone"; rc=1; }
          [ "$rc" = 0 ] || { echo "--- server log (tail)"; sudo tail -60 "$RUNNER_TEMP/e2e/server.log";
                             echo "--- standalone server log (tail)"; sudo tail -60 "$RUNNER_TEMP/e2e/server-dev.log"; }
          sudo recipe/ci/e2e-server.sh down "$RUNNER_TEMP/e2e"
          exit "$rc"
